[mod-name]
unlock-quality-ui=Unlock Quality UI

[mod-description]
unlock-quality-ui=Unlocks the quality UI even before researching quality modules; can be toggled at runtime.

[mod-setting-name]
unlock-quality-ui-unlock-quality-ui=Unlock quality UI

[mod-setting-description]
unlock-quality-ui-unlock-quality-ui=Enable the selection of quality in interfaces such as item, recipe, and signal selection even before quality has been researched.\n\nNote that after quality has been researched, this option has no effect and cannot be used to hide the quality UI again.
